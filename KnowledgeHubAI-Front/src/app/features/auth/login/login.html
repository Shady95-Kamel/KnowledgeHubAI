<div class="login-page">
  <div class="login-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your KnowledgeHubAI account</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email address</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
          email
          [disabled]="isLoading()"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
          [disabled]="isLoading()"
        />
      </div>

      @if (errorMessage()) {
        <p class="error-message" role="alert">
          {{ errorMessage() }}
        </p>
      }

      <p class="forgot-password">
        <a routerLink="/forgotpassword">
          Forgot password
        </a>
      </p>

      <button
        type="submit"
        class="primary-button"
        [disabled]="loginForm.invalid || isLoading()"
      >
        {{ isLoading() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <div class="separator">
      <span>OR</span>
    </div>


<button
type="button"
class="google-button"
[disabled]="isLoading()"
(click)="loginWithGoogle()"
>

    <button
  type="button"

  </div>
</div>
